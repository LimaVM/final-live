<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevLima MotoStream - Plataforma de Streaming</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .container {
            text-align: center;
            max-width: 600px;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .logo {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            backdrop-filter: blur(5px);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .form-group input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .button-group {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .btn {
            flex: 1;
            padding: 1rem 2rem;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(45deg, #ff6b6b, #ee5a52);
            color: white;
        }

        .btn-secondary {
            background: linear-gradient(45deg, #4ecdc4, #44a08d);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .features {
            margin-top: 3rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
        }

        .feature {
            padding: 1rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            backdrop-filter: blur(5px);
        }

        .feature-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .feature-title {
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .feature-desc {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .stats {
            margin-top: 2rem;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            display: none;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1rem;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 1.5rem;
            font-weight: bold;
            color: #4ecdc4;
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            .container {
                margin: 1rem;
                padding: 1.5rem;
            }

            .logo {
                font-size: 2rem;
            }

            .button-group {
                flex-direction: column;
            }

            .features {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🏍️ DevLima MotoStream</div>
        <div class="subtitle">Plataforma de Streaming de Alta Performance</div>
        
        <div class="form-group">
            <label for="liveId">ID da Live</label>
            <input type="text" id="liveId" placeholder="Digite o ID da sua live (ex: minha-live-123)" value="">
        </div>
        
        <div class="button-group">
            <button class="btn btn-primary" onclick="startStreaming()">
                🎥 Iniciar Transmissão
            </button>
            <button class="btn btn-secondary" onclick="watchStream()">
                👥 Assistir Live
            </button>
        </div>
        
        <div class="features">
            <div class="feature">
                <div class="feature-icon">⚡</div>
                <div class="feature-title">Alta Performance</div>
                <div class="feature-desc">Backend em Go para máxima velocidade</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🔒</div>
                <div class="feature-title">Seguro</div>
                <div class="feature-desc">Conexões criptografadas SSL/TLS</div>
            </div>
            <div class="feature">
                <div class="feature-icon">📱</div>
                <div class="feature-title">Responsivo</div>
                <div class="feature-desc">Funciona em qualquer dispositivo</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🌐</div>
                <div class="feature-title">WebRTC</div>
                <div class="feature-desc">Streaming em tempo real</div>
            </div>
        </div>
        
        <div class="stats" id="stats">
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-number" id="activeSessions">0</div>
                    <div class="stat-label">Lives Ativas</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="totalViewers">0</div>
                    <div class="stat-label">Espectadores</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="totalStreamers">0</div>
                    <div class="stat-label">Streamers</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="uptime">0s</div>
                    <div class="stat-label">Uptime</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Gera ID aleatório se não fornecido
        function generateLiveId() {
            return 'live_' + Math.random().toString(36).substr(2, 9);
        }

        // Inicia transmissão
        function startStreaming() {
            let liveId = document.getElementById('liveId').value.trim();
            if (!liveId) {
                liveId = generateLiveId();
                document.getElementById('liveId').value = liveId;
            }
            
            // Valida ID da live
            if (!/^[a-zA-Z0-9_-]+$/.test(liveId)) {
                alert('ID da live deve conter apenas letras, números, _ e -');
                return;
            }
            
            const url = `/live/${liveId}?camera=user`;
            window.open(url, '_blank');
        }

        // Assiste stream
        function watchStream() {
            let liveId = document.getElementById('liveId').value.trim();
            if (!liveId) {
                alert('Digite o ID da live para assistir');
                return;
            }
            
            // Valida ID da live
            if (!/^[a-zA-Z0-9_-]+$/.test(liveId)) {
                alert('ID da live deve conter apenas letras, números, _ e -');
                return;
            }
            
            const url = `/live/${liveId}`;
            window.open(url, '_blank');
        }

        // Carrega estatísticas
        async function loadStats() {
            try {
                const response = await fetch('/api/stats');
                const stats = await response.json();
                
                document.getElementById('activeSessions').textContent = stats.activeSessions || 0;
                document.getElementById('totalViewers').textContent = stats.totalViewers || 0;
                document.getElementById('totalStreamers').textContent = stats.totalStreamers || 0;
                document.getElementById('uptime').textContent = stats.uptime || '0s';
                
                // Mostra estatísticas se há atividade
                if (stats.activeSessions > 0 || stats.totalViewers > 0) {
                    document.getElementById('stats').style.display = 'block';
                }
            } catch (error) {
                console.log('Erro ao carregar estatísticas:', error);
            }
        }

        // Enter para iniciar
        document.getElementById('liveId').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                startStreaming();
            }
        });

        // Carrega estatísticas periodicamente
        loadStats();
        setInterval(loadStats, 10000); // A cada 10 segundos

        console.log('🚀 DevLima MotoStream - Frontend carregado');
    </script>
</body>
</html>
